[build-system]
requires = ["setuptools>=77"]  # SPDX licence expression
build-backend = "setuptools.build_meta"

[project]
name = "vocal-analysis"
version = "0.0.1"
description = "Real-time vocal analysis pipeline (MK II)"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
# torch is deliberately not listed: it must come from AMD's ROCm wheel index
# (gfx1151 build), and letting pip resolve it would replace that build with a
# CPU/CUDA wheel. See docs/decisions.md (D-001).
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8"]  # matplotlib: diagnostic plots
baselines = ["praat-parselmouth>=0.4"]
train = ["schedulefree>=1.4"]  # --optimizer schedulefree (D-018); torch itself comes from the ROCm index (D-001)

[project.scripts]
va = "vocal_analysis.cli:main"

[tool.setuptools.packages.find]
include = ["vocal_analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a working torch GPU device"]
